name: Check root skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "*/agent-harness/**"
      - "registry.json"
      - "matrix_registry.json"
      - "cli-it-matrix/**"
      - ".github/scripts/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate root skills + registries
        run: python .github/scripts/validate_root_skills.py

      - name: Verify skill generator reproduces committed skills
        env:
          CLI_HUB_NO_ANALYTICS: "1"
        run: |
          pip install --quiet pytest click
          python cli-it-plugin/skill_generator.py demoapp/agent-harness
          git diff --exit-code skills demoapp/agent-harness/cli_it/demoapp/skills
